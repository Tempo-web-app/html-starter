<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tempo Profile</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f7f8fc;

    color: #17191c;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

}

.card {

    width: 100%;

    max-width: 520px;

    background: white;

    border:
        1px solid #e8e8ee;

    border-radius: 24px;

    padding: 35px;

    box-shadow:
        0 15px 50px
        rgba(20,20,40,.08);

}

.logo {

    display: flex;

    align-items: center;

    gap: 9px;

    font-size: 21px;

    font-weight: 800;

}

.logo-mark {

    width: 34px;

    height: 34px;

    border-radius: 10px;

    background: #6657e8;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

}

.profile {

    text-align: center;

    margin-top: 35px;

}

.avatar {

    width: 75px;

    height: 75px;

    border-radius: 50%;

    background: #efedff;

    color: #6657e8;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    font-weight: 800;

    margin: auto;

}

h1 {

    margin-top: 15px;

    font-size: 27px;

}

.username {

    color: #737681;

    margin-top: 4px;

    font-size: 13px;

}

.stats {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 10px;

    margin-top: 28px;

}

.stat {

    background: #f7f8fc;

    padding: 17px 10px;

    border-radius: 13px;

    text-align: center;

}

.value {

    font-size: 21px;

    font-weight: 800;

}

.label {

    margin-top: 4px;

    color: #737681;

    font-size: 10px;

}

.footer {

    text-align: center;

    color: #a2a4ad;

    font-size: 11px;

    margin-top: 30px;

}

.error {

    text-align: center;

    color: #e05252;

    padding: 40px 10px;

}

@media(max-width:450px) {

    .stats {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="card">

    <div class="logo">

        <div class="logo-mark">
            T
        </div>

        Tempo

    </div>


    <div id="loading">
        Loading profile...
    </div>


    <div
        id="profile"
        style="display:none;"
    >

        <div class="profile">

            <div
                class="avatar"
                id="avatar"
            >
                ?
            </div>

            <h1 id="displayName">
                User
            </h1>

            <div
                class="username"
                id="username"
            >
                @user
            </div>

        </div>


        <div class="stats">

            <div class="stat">

                <div
                    class="value"
                    id="taskCount"
                >
                    0
                </div>

                <div class="label">
                    Tasks
                </div>

            </div>


            <div class="stat">

                <div
                    class="value"
                    id="completedCount"
                >
                    0
                </div>

                <div class="label">
                    Completed
                </div>

            </div>


            <div class="stat">

                <div
                    class="value"
                    id="studyMinutes"
                >
                    0
                </div>

                <div class="label">
                    Study Minutes
                </div>

            </div>

        </div>


        <div class="footer">
            Powered by Tempo · Giving People Their Time Back
        </div>

    </div>


    <div
        id="error"
        class="error"
        style="display:none;"
    >
        Profile not found.
    </div>

</div>



<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";


const params =
new URLSearchParams(
    window.location.search
);


const username =
params.get("user");


async function api(
    action,
    data = {}
) {

    const response =
        await fetch(
            API_URL,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action,

                        username,

                        ...data

                    })

            }
        );


    return await response.json();

}


async function loadProfile() {

    if (!username) {

        showError();

        return;

    }


    try {

        const tasks =
            await api(
                "getTasks"
            );


        const sessions =
            await api(
                "getSessions"
            );


        if (
            !tasks.success ||
            !sessions.success
        ) {

            showError();

            return;

        }


        const taskList =
            tasks.tasks;


        const completed =
            taskList.filter(
                task => task.completed === true
            ).length;


        const totalMinutes =
            sessions.sessions.reduce(
                (
                    total,
                    session
                ) =>
                    total +
                    Number(session.minutes || 0),
                0
            );


        document.getElementById(
            "displayName"
        ).textContent =
            username;


        document.getElementById(
            "username"
        ).textContent =
            "@" + username;


        document.getElementById(
            "avatar"
        ).textContent =
            username
                .charAt(0)
                .toUpperCase();


        document.getElementById(
            "taskCount"
        ).textContent =
            taskList.length;


        document.getElementById(
            "completedCount"
        ).textContent =
            completed;


        document.getElementById(
            "studyMinutes"
        ).textContent =
            totalMinutes;


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "profile"
        ).style.display =
            "block";


    } catch (error) {

        showError();

    }

}


function showError() {

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "error"
    ).style.display =
        "block";

}


loadProfile();

</script>

</body>
</html>
