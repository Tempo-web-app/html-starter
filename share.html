<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tempo - Share</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: #f7f8fa;
  color: #171717;
}

header {
  height: 70px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: #555;
  padding: 9px 14px;
  border-radius: 9px;
}

nav a:hover,
nav a.active {
  background: #f0f1f3;
  color: #111;
}

.container {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

.hero {
  margin-bottom: 28px;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 8px;
}

.hero p {
  color: #666;
}

.card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

.card h2 {
  margin-bottom: 18px;
}

.form {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 12px;
  align-items: end;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

label {
  font-size: 14px;
  font-weight: 600;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d6d9de;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #111;
  color: white;
}

.primary:hover {
  opacity: 0.85;
}

.secondary {
  background: #f0f1f3;
  color: #222;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 9px;
  display: none;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.share-item {
  padding: 18px 0;
  border-bottom: 1px solid #eee;
}

.share-item:last-child {
  border-bottom: none;
}

.share-top {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
}

.user {
  font-weight: 700;
}

.task {
  margin-top: 5px;
  color: #666;
  font-size: 14px;
}

.badge {
  padding: 6px 10px;
  border-radius: 20px;
  background: #f0f1f3;
  font-size: 12px;
  font-weight: 700;
}

.badge.pending {
  background: #fff7ed;
  color: #9a3412;
}

.badge.accepted {
  background: #dcfce7;
  color: #166534;
}

.actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
}

.empty {
  text-align: center;
  padding: 35px;
  color: #777;
}

.loading {
  text-align: center;
  padding: 30px;
}

@media(max-width:700px) {

  .form {
    grid-template-columns: 1fr;
  }

  header {
    height: auto;
    padding: 16px;
    gap: 12px;
    align-items: flex-start;
    flex-direction: column;
  }

  nav a {
    font-size: 13px;
  }

  .share-top {
    align-items: flex-start;
    flex-direction: column;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    Tempo
  </div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="tasks.html">Tasks</a>
    <a href="tests.html">Tests</a>
    <a href="schedule.html">Schedule</a>
    <a href="share.html" class="active">Share</a>
  </nav>

</header>


<main class="container">

  <section class="hero">

    <h1>Share Tasks</h1>

    <p>
      Send tasks to other Tempo users and manage shared assignments.
    </p>

  </section>


  <section class="card">

    <h2>Share a task</h2>

    <div class="form">

      <div class="field">

        <label for="username">
          Tempo username
        </label>

        <input
          id="username"
          type="text"
          placeholder="username"
          autocomplete="off"
        >

      </div>


      <div class="field">

        <label for="task">
          Task
        </label>

        <select id="task">

          <option value="">
            Loading tasks...
          </option>

        </select>

      </div>


      <button
        id="shareButton"
        class="primary"
        onclick="shareTask()"
      >
        Share
      </button>

    </div>


    <div
      id="status"
      class="status"
    ></div>

  </section>


  <section class="card">

    <h2>Your shared tasks</h2>

    <div id="shares">

      <div class="loading">
        Loading shares...
      </div>

    </div>

  </section>

</main>


<script>

/* =========================================================
   TEMPO API
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";


/* =========================================================
   SESSION
========================================================= */

const token =
  localStorage.getItem("tempoToken");


if (!token) {

  showFatalError(
    "You are not logged in. Please return to the Tempo login page."
  );

}


/* =========================================================
   API REQUEST
========================================================= */

async function api(action, data = {}) {

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
          action: action,
          ...data
        })
      }
    );


  if (!response.ok) {

    throw new Error(
      "Tempo server returned HTTP " +
      response.status
    );

  }


  const result =
    await response.json();


  return result;

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks() {

  const select =
    document.getElementById("task");


  try {

    const result =
      await api(
        "getTasks",
        {
          token: token
        }
      );


    if (!result.success) {

      if (
        result.error ===
        "UNAUTHORIZED"
      ) {

        handleUnauthorized();

        return;

      }


      throw new Error(
        result.error ||
        "Could not load tasks."
      );

    }


    const tasks =
      Array.isArray(result.tasks)
        ? result.tasks
        : [];


    if (tasks.length === 0) {

      select.innerHTML =
        `<option value="">
          No tasks available
        </option>`;

      return;

    }


    select.innerHTML =
      tasks
        .map(function(task) {

          const title =
            task.title ||
            "Untitled task";


          const completed =
            task.completed
              ? " ✓"
              : "";


          return `
            <option value="${escapeHTML(task.taskID)}">
              ${escapeHTML(title)}${completed}
            </option>
          `;

        })
        .join("");

  }


  catch(error) {

    select.innerHTML =
      `<option value="">
        Failed to load tasks
      </option>`;


    showStatus(
      error.message,
      true
    );

  }

}


/* =========================================================
   SHARE TASK
========================================================= */

async function shareTask() {

  const username =
    document
      .getElementById("username")
      .value
      .trim()
      .toLowerCase();


  const taskID =
    document
      .getElementById("task")
      .value;


  if (!username) {

    showStatus(
      "Enter the username of the person you want to share with.",
      true
    );

    return;

  }


  if (!taskID) {

    showStatus(
      "Choose a task first.",
      true
    );

    return;

  }


  const button =
    document.getElementById(
      "shareButton"
    );


  button.disabled = true;

  button.textContent =
    "Sharing...";


  try {

    const result =
      await api(
        "shareTask",
        {
          token: token,
          targetUsername: username,
          taskID: taskID
        }
      );


    if (!result.success) {

      if (
        result.error ===
        "UNAUTHORIZED"
      ) {

        handleUnauthorized();

        return;

      }


      const errors = {

        USER_NOT_FOUND:
          "That Tempo user does not exist.",

        CANNOT_SHARE_WITH_SELF:
          "You cannot share a task with yourself.",

        TASK_NOT_FOUND:
          "That task could not be found."

      };


      throw new Error(
        errors[result.error] ||
        result.error ||
        "Could not share the task."
      );

    }


    showStatus(
      "Task shared successfully!"
    );


    document
      .getElementById("username")
      .value = "";


    await loadShares();

  }


  catch(error) {

    showStatus(
      error.message,
      true
    );

  }


  finally {

    button.disabled = false;

    button.textContent =
      "Share";

  }

}


/* =========================================================
   LOAD SHARES
========================================================= */

async function loadShares() {

  const container =
    document.getElementById(
      "shares"
    );


  container.innerHTML =
    `<div class="loading">
      Loading shares...
    </div>`;


  try {

    const result =
      await api(
        "getShares",
        {
          token: token
        }
      );


    if (!result.success) {

      if (
        result.error ===
        "UNAUTHORIZED"
      ) {

        handleUnauthorized();

        return;

      }


      throw new Error(
        result.error ||
        "Could not load shares."
      );

    }


    const shares =
      Array.isArray(result.shares)
        ? result.shares
        : [];


    if (shares.length === 0) {

      container.innerHTML =
        `<div class="empty">
          No shared tasks yet.
        </div>`;

      return;

    }


    const currentUsername =
      getCurrentUsername();


    container.innerHTML =
      shares
        .slice()
        .reverse()
        .map(function(share) {

          const incoming =
            String(share.toUser)
              .toLowerCase() ===
            currentUsername;


          const status =
            String(
              share.status || ""
            ).toLowerCase();


          return `

            <div class="share-item">

              <div class="share-top">

                <div>

                  <div class="user">

                    ${
                      incoming
                        ? "From: " +
                          escapeHTML(
                            share.fromUser
                          )
                        : "To: " +
                          escapeHTML(
                            share.toUser
                          )
                    }

                  </div>


                  <div class="task">

                    Task ID:
                    ${escapeHTML(
                      share.taskID
                    )}

                  </div>

                </div>


                <div
                  class="badge ${escapeHTML(status)}"
                >

                  ${escapeHTML(status)}

                </div>

              </div>


              ${
                incoming &&
                status === "pending"

                ? `

                  <div class="actions">

                    <button
                      class="primary"
                      onclick="acceptShare('${escapeHTML(share.shareID)}')"
                    >
                      Accept
                    </button>

                  </div>

                `

                : ""

              }

            </div>

          `;

        })
        .join("");

  }


  catch(error) {

    container.innerHTML =
      `<div class="empty">
        ${escapeHTML(error.message)}
      </div>`;

  }

}


/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUsername() {

  return (
    localStorage.getItem(
      "tempoUsername"
    ) ||

    localStorage.getItem(
      "username"
    ) ||

    ""
  )
    .trim()
    .toLowerCase();

}


/* =========================================================
   ACCEPT SHARE
========================================================= */

async function acceptShare(shareID) {

  try {

    showStatus(
      "Accepting shared task..."
    );


    const result =
      await api(
        "acceptShare",
        {
          token: token,
          shareID: shareID
        }
      );


    if (!result.success) {

      if (
        result.error ===
        "UNAUTHORIZED"
      ) {

        handleUnauthorized();

        return;

      }


      throw new Error(
        result.error ||
        "Could not accept the share."
      );

    }


    showStatus(
      "Shared task accepted!"
    );


    await loadShares();

  }


  catch(error) {

    showStatus(
      error.message,
      true
    );

  }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status " +
    (
      error
        ? "error"
        : "success"
    );

}


/* =========================================================
   UNAUTHORIZED
========================================================= */

function handleUnauthorized() {

  localStorage.removeItem(
    "tempoToken"
  );


  showFatalError(
    "Your Tempo session expired. Please log in again."
  );

}


/* =========================================================
   FATAL ERROR
========================================================= */

function showFatalError(message) {

  const container =
    document.getElementById(
      "shares"
    );


  if (container) {

    container.innerHTML = `
      <div class="empty">
        ${escapeHTML(message)}
      </div>
    `;

  }

}


/* =========================================================
   START
========================================================= */

if (token) {

  loadTasks();

  loadShares();

}

</script>

</body>
</html>
