<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tempo - Settings</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Inter, Arial, sans-serif;
}

body {
    background: #f6f7fb;
    color: #171717;
    min-height: 100vh;
}

.navbar {
    height: 70px;
    background: white;
    border-bottom: 1px solid #e7e7e7;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.nav-links {
    display: flex;
    gap: 10px;
}

.nav-links a {
    text-decoration: none;
    color: #555;
    padding: 9px 14px;
    border-radius: 9px;
}

.nav-links a:hover {
    background: #f0f0f0;
}

.container {
    max-width: 900px;
    margin: 45px auto;
    padding: 0 20px;
}

h1 {
    font-size: 34px;
    margin-bottom: 8px;
}

.subtitle {
    color: #777;
    margin-bottom: 30px;
}

.card {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 20px;
}

.card h2 {
    font-size: 20px;
    margin-bottom: 20px;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 12px 14px;

    border: 1px solid #d9d9d9;
    border-radius: 10px;

    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #777;
}

input:disabled {
    background: #f2f2f2;
    color: #777;
}

button {
    border: none;
    border-radius: 10px;

    padding: 12px 18px;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;
}

.primary {
    background: #171717;
    color: white;
}

.primary:hover {
    background: #333;
}

.danger {
    background: #fff0f0;
    color: #c62828;
}

.danger:hover {
    background: #ffe1e1;
}

.status {
    margin-top: 14px;
    font-size: 14px;
    color: #555;
}

.profile-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 14px 0;
    border-bottom: 1px solid #eee;
}

.profile-row:last-child {
    border-bottom: none;
}

.profile-label {
    color: #777;
    font-size: 14px;
}

.profile-value {
    font-weight: 600;
}

.hidden {
    display: none;
}

</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Tempo
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="study.html">Study</a>
        <a href="schedule.html">Schedule</a>
        <a href="share.html">Share</a>
    </div>

</nav>


<main class="container">

    <h1>Settings</h1>

    <p class="subtitle">
        Manage your Tempo account.
    </p>


    <!-- PROFILE -->

    <section class="card">

        <h2>Profile</h2>

        <div class="profile-row">

            <div class="profile-label">
                Username
            </div>

            <div
                class="profile-value"
                id="usernameDisplay"
            >
                Loading...
            </div>

        </div>


        <div class="field" style="margin-top:20px;">

            <label for="displayName">
                Display name
            </label>

            <input
                id="displayName"
                type="text"
                placeholder="Your name"
            >

        </div>


        <button
            class="primary"
            onclick="saveProfile()"
        >
            Save changes
        </button>

        <div
            id="profileStatus"
            class="status"
        ></div>

    </section>


    <!-- PASSWORD -->

    <section class="card">

        <h2>Password</h2>

        <div class="field">

            <label for="currentPassword">
                Current password
            </label>

            <input
                id="currentPassword"
                type="password"
                placeholder="Current password"
            >

        </div>


        <div class="field">

            <label for="newPassword">
                New password
            </label>

            <input
                id="newPassword"
                type="password"
                placeholder="At least 6 characters"
            >

        </div>


        <button
            class="primary"
            onclick="changePassword()"
        >
            Change password
        </button>

        <div
            id="passwordStatus"
            class="status"
        ></div>

    </section>


    <!-- ACCOUNT -->

    <section class="card">

        <h2>Account</h2>

        <button
            class="danger"
            onclick="logout()"
        >
            Log out
        </button>

    </section>

</main>


<script>

/* =====================================================
   TEMPO BACKEND
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";


/* =====================================================
   LOAD USER
===================================================== */

function loadUser() {

    const username =
        localStorage.getItem("tempo_username");

    const displayName =
        localStorage.getItem("tempo_displayName");


    if (!username) {

        window.location.href = "index.html";

        return;

    }


    document.getElementById(
        "usernameDisplay"
    ).textContent = username;


    document.getElementById(
        "displayName"
    ).value = displayName || username;

}


/* =====================================================
   SAVE PROFILE
===================================================== */

function saveProfile() {

    const displayName =
        document
            .getElementById("displayName")
            .value
            .trim();


    const status =
        document.getElementById(
            "profileStatus"
        );


    if (!displayName) {

        status.textContent =
            "Please enter a display name.";

        return;

    }


    /*
       The current backend does not yet contain
       updateProfile, so we save this locally
       for now.
    */

    localStorage.setItem(
        "tempo_displayName",
        displayName
    );


    status.textContent =
        "Display name saved.";

}


/* =====================================================
   CHANGE PASSWORD
===================================================== */

function changePassword() {

    const status =
        document.getElementById(
            "passwordStatus"
        );


    status.textContent =
        "Password changing will be connected to the backend next.";

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    const token =
        localStorage.getItem(
            "tempo_token"
        );


    if (token) {

        try {

            await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body: JSON.stringify({

                    action: "logout",

                    token: token

                })

            });

        }

        catch (error) {

            console.log(
                "Logout request failed:",
                error
            );

        }

    }


    localStorage.removeItem(
        "tempo_token"
    );

    localStorage.removeItem(
        "tempo_username"
    );

    localStorage.removeItem(
        "tempo_displayName"
    );


    window.location.href =
        "index.html";

}


/* =====================================================
   START
===================================================== */

loadUser();

</script>

</body>
</html>
