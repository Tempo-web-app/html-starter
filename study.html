<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo - Study</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: #f7f8fa;
  color: #171717;
}

header {
  height: 70px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
}

nav {
  display: flex;
  gap: 8px;
}

nav a {
  text-decoration: none;
  color: #555;
  padding: 9px 14px;
  border-radius: 9px;
  font-size: 14px;
}

nav a:hover,
nav a.active {
  background: #f0f1f3;
  color: #111;
}

.container {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

.hero {
  margin-bottom: 28px;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 8px;
}

.hero p {
  color: #666;
}

.card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

.card h2 {
  margin-bottom: 18px;
}

.timer {
  text-align: center;
  padding: 35px 20px;
}

.timer-display {
  font-size: 72px;
  font-weight: 800;
  letter-spacing: 2px;
  margin: 15px 0 25px;
}

.timer-status {
  color: #666;
  margin-bottom: 20px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.primary {
  background: #111;
  color: white;
}

.primary:hover:not(:disabled) {
  opacity: 0.85;
}

.secondary {
  background: #f0f1f3;
  color: #222;
}

.danger {
  background: #fee2e2;
  color: #991b1b;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

label {
  font-size: 14px;
  font-weight: 600;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d6d9de;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

.session-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.info-box {
  background: #f7f8fa;
  border-radius: 10px;
  padding: 15px;
}

.info-label {
  font-size: 12px;
  color: #777;
  margin-bottom: 5px;
}

.info-value {
  font-weight: 700;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 9px;
  display: none;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.empty {
  text-align: center;
  padding: 25px;
  color: #777;
}

@media(max-width:700px) {

  header {
    padding: 0 16px;
  }

  nav {
    gap: 2px;
  }

  nav a {
    padding: 7px 8px;
    font-size: 12px;
  }

  .timer-display {
    font-size: 52px;
  }

  .session-info {
    grid-template-columns: 1fr;
  }
}
</style>

</head>

<body>

<header>

  <div class="logo">
    Tempo
  </div>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="task.html">Tasks</a>
    <a href="tests.html">Tests</a>
    <a href="study.html" class="active">Study</a>
    <a href="schedule.html">Schedule</a>
    <a href="share.html">Share</a>
  </nav>

</header>

<main class="container">

  <section class="hero">

```
<h1>Study Session</h1>

<p>
  Focus on one task and track your study time.
</p>
```

  </section>

  <!-- TASK SELECTION -->

  <section class="card">

```
<h2>Choose a task</h2>

<div class="field">

  <label for="taskSelect">
    Task
  </label>

  <select id="taskSelect">

    <option value="">
      Loading tasks...
    </option>

  </select>

</div>

<div id="taskInfo" class="session-info" style="display:none;">

  <div class="info-box">

    <div class="info-label">
      Subject
    </div>

    <div
      class="info-value"
      id="taskSubject"
    >
      -
    </div>

  </div>

  <div class="info-box">

    <div class="info-label">
      Estimated time
    </div>

    <div
      class="info-value"
      id="taskMinutes"
    >
      -
    </div>

  </div>

</div>
```

  </section>

  <!-- TIMER -->

  <section class="card timer">

```
<h2>Focus Timer</h2>

<div
  id="timerDisplay"
  class="timer-display"
>
  25:00
</div>

<div
  id="timerStatus"
  class="timer-status"
>
  Ready to study
</div>

<div class="controls">

  <button
    id="startButton"
    class="primary"
    onclick="startTimer()"
  >
    Start
  </button>

  <button
    id="pauseButton"
    class="secondary"
    onclick="pauseTimer()"
    disabled
  >
    Pause
  </button>

  <button
    id="resetButton"
    class="secondary"
    onclick="resetTimer()"
  >
    Reset
  </button>

  <button
    id="finishButton"
    class="danger"
    onclick="finishSession()"
    disabled
  >
    Finish
  </button>

</div>

<div
  id="status"
  class="status"
></div>
```

  </section>

  <!-- SESSION INFO -->

  <section class="card">

```
<h2>Session</h2>

<div class="session-info">

  <div class="info-box">

    <div class="info-label">
      Time studied
    </div>

    <div
      class="info-value"
      id="studiedMinutes"
    >
      0 minutes
    </div>

  </div>

  <div class="info-box">

    <div class="info-label">
      Session status
    </div>

    <div
      class="info-value"
      id="sessionState"
    >
      Not started
    </div>

  </div>

</div>
```

  </section>

</main>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";


/* =========================================================
   AUTHENTICATION
========================================================= */

const token =
  localStorage.getItem("tempoToken");


if (!token) {

  window.location.href =
    "index.html";

}


/* =========================================================
   API
========================================================= */

async function api(action, data = {}) {

  const response =
    await fetch(
      API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({
            action: action,
            ...data
          })
      }
    );

  const result =
    await response.json();

  return result;

}


/* =========================================================
   TIMER VARIABLES
========================================================= */

let timerSeconds = 25 * 60;

let timerInterval = null;

let timerRunning = false;

let sessionStartedAt = null;

let selectedTask = null;


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks() {

  const select =
    document.getElementById(
      "taskSelect"
    );

  try {

    const result =
      await api(
        "getTasks",
        {
          token: token
        }
      );


    if (!result.success) {

      if (
        result.error ===
        "UNAUTHORIZED"
      ) {

        localStorage.removeItem(
          "tempoToken"
        );

        window.location.href =
          "index.html";

        return;

      }

      throw new Error(
        result.error ||
        "Could not load tasks."
      );

    }


    const tasks =
      result.tasks || [];


    const unfinished =
      tasks.filter(
        task => !task.completed
      );


    if (!unfinished.length) {

      select.innerHTML =
        `<option value="">
          No unfinished tasks
        </option>`;

      return;

    }


    select.innerHTML =
      `<option value="">
        Select a task
      </option>`;


    unfinished.forEach(task => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        task.taskID;

      option.textContent =
        task.title +
        (
          task.subject
            ? " · " + task.subject
            : ""
        );

      select.appendChild(
        option
      );

    });


  }

  catch(error) {

    select.innerHTML =
      `<option value="">
        Failed to load tasks
      </option>`;

    showStatus(
      error.message,
      true
    );

  }

}


/* =========================================================
   TASK SELECTION
========================================================= */

document
  .getElementById("taskSelect")
  .addEventListener(
    "change",
    function() {

      const taskID =
        this.value;


      if (!taskID) {

        selectedTask = null;

        document
          .getElementById(
            "taskInfo"
          )
          .style.display = "none";

        return;

      }


      loadSelectedTask(
        taskID
      );

    }
  );


async function loadSelectedTask(
  taskID
) {

  try {

    const result =
      await api(
        "getTasks",
        {
          token: token
        }
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        "Could not load task."
      );

    }


    selectedTask =
      (result.tasks || [])
        .find(
          task =>
            String(task.taskID) ===
            String(taskID)
        );


    if (!selectedTask) {

      return;

    }


    document
      .getElementById(
        "taskSubject"
      )
      .textContent =
        selectedTask.subject ||
        "No subject";


    document
      .getElementById(
        "taskMinutes"
      )
      .textContent =
        selectedTask.minutes +
        " minutes";


    document
      .getElementById(
        "taskInfo"
      )
      .style.display =
        "grid";


  }

  catch(error) {

    showStatus(
      error.message,
      true
    );

  }

}


/* =========================================================
   TIMER DISPLAY
========================================================= */

function updateTimerDisplay() {

  const minutes =
    Math.floor(
      timerSeconds / 60
    );

  const seconds =
    timerSeconds % 60;


  document
    .getElementById(
      "timerDisplay"
    )
    .textContent =
      String(minutes)
        .padStart(2, "0") +
      ":" +
      String(seconds)
        .padStart(2, "0");


  const studied =
    Math.floor(
      (
        25 * 60 -
        timerSeconds
      ) / 60
    );


  document
    .getElementById(
      "studiedMinutes"
    )
    .textContent =
      studied +
      " minutes";

}


/* =========================================================
   START TIMER
========================================================= */

function startTimer() {

  if (timerRunning) {
    return;
  }


  if (!selectedTask) {

    showStatus(
      "Choose a task before starting.",
      true
    );

    return;

  }


  if (!sessionStartedAt) {

    sessionStartedAt =
      new Date();

  }


  timerRunning = true;


  document
    .getElementById(
      "startButton"
    )
    .disabled = true;


  document
    .getElementById(
      "pauseButton"
    )
    .disabled = false;


  document
    .getElementById(
      "finishButton"
    )
    .disabled = false;


  document
    .getElementById(
      "sessionState"
    )
    .textContent =
      "Studying";


  document
    .getElementById(
      "timerStatus"
    )
    .textContent =
      "Focus mode";


  timerInterval =
    setInterval(
      function() {

        if (
          timerSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );

          timerRunning = false;

          finishSession();

          return;

        }


        timerSeconds--;

        updateTimerDisplay();

      },
      1000
    );

}


/* =========================================================
   PAUSE TIMER
========================================================= */

function pauseTimer() {

  if (!timerRunning) {
    return;
  }


  clearInterval(
    timerInterval
  );


  timerRunning = false;


  document
    .getElementById(
      "startButton"
    )
    .disabled = false;


  document
    .getElementById(
      "pauseButton"
    )
    .disabled = true;


  document
    .getElementById(
      "timerStatus"
    )
    .textContent =
      "Paused";


  document
    .getElementById(
      "sessionState"
    )
    .textContent =
      "Paused";

}


/* =========================================================
   RESET TIMER
========================================================= */

function resetTimer() {

  clearInterval(
    timerInterval
  );


  timerRunning = false;

  timerSeconds =
    25 * 60;

  sessionStartedAt = null;


  document
    .getElementById(
      "startButton"
    )
    .disabled = false;


  document
    .getElementById(
      "pauseButton"
    )
    .disabled = true;


  document
    .getElementById(
      "finishButton"
    )
    .disabled = true;


  document
    .getElementById(
      "timerStatus"
    )
    .textContent =
      "Ready to study";


  document
    .getElementById(
      "sessionState"
    )
    .textContent =
      "Not started";


  updateTimerDisplay();

}


/* =========================================================
   FINISH SESSION
========================================================= */

async function finishSession() {

  clearInterval(
    timerInterval
  );


  timerRunning = false;


  if (!sessionStartedAt) {

    showStatus(
      "No study session has started.",
      true
    );

    return;

  }


  const studiedSeconds =
    (25 * 60) -
    timerSeconds;


  const minutes =
    Math.max(
      1,
      Math.round(
        studiedSeconds / 60
      )
    );


  if (
    !selectedTask
  ) {

    showStatus(
      "No task selected.",
      true
    );

    return;

  }


  const endedAt =
    new Date();


  try {

    showStatus(
      "Saving study session..."
    );


    const result =
      await api(
        "createSession",
        {

          token: token,

          taskID:
            selectedTask.taskID,

          minutes:
            minutes,

          startedAt:
            sessionStartedAt.toISOString(),

          endedAt:
            endedAt.toISOString()

        }
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        "Could not save session."
      );

    }


    document
      .getElementById(
        "sessionState"
      )
      .textContent =
        "Completed";


    document
      .getElementById(
        "timerStatus"
      )
      .textContent =
        "Session saved";


    document
      .getElementById(
        "finishButton"
      )
      .disabled = true;


    document
      .getElementById(
        "pauseButton"
      )
      .disabled = true;


    showStatus(
      "Study session saved successfully!"
    );


  }

  catch(error) {

    showStatus(
      error.message,
      true
    );

  }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status " +
    (
      error
        ? "error"
        : "success"
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

updateTimerDisplay();

loadTasks();

</script>

</body>
</html>
