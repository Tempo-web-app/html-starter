<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tempo · Focus</title>

<style>

:root {

    --primary: #6657e8;
    --primary-light: #efedff;

    --background: #f7f8fc;
    --surface: #ffffff;

    --text: #17191c;
    --text-secondary: #737681;
    --text-tertiary: #a2a4ad;

    --border: #e8e8ee;

    --success: #28a866;

}


* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


body {

    min-height: 100vh;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        var(--background);

    color:
        var(--text);

}


button,
input,
select {

    font: inherit;

}


button {

    cursor: pointer;

}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {

    height: 72px;

    background:
        rgba(255,255,255,.9);

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 30px;

}


.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    font-weight: 800;

    font-size: 20px;

}


.logo-mark {

    width: 34px;
    height: 34px;

    border-radius: 10px;

    background:
        var(--primary);

    color:
        white;

    display: flex;

    align-items: center;

    justify-content: center;

}


.back-button {

    border:
        1px solid var(--border);

    background:
        white;

    border-radius:
        10px;

    padding:
        9px 14px;

}


/* =====================================================
   MAIN
===================================================== */

.container {

    max-width:
        760px;

    margin:
        0 auto;

    padding:
        60px 20px;

}


.eyebrow {

    color:
        var(--primary);

    font-size:
        12px;

    font-weight:
        800;

    text-transform:
        uppercase;

    letter-spacing:
        .08em;

    text-align:
        center;

}


h1 {

    text-align:
        center;

    font-size:
        34px;

    margin-top:
        8px;

    letter-spacing:
        -1px;

}


.subtitle {

    text-align:
        center;

    color:
        var(--text-secondary);

    margin-top:
        8px;

}


/* =====================================================
   TIMER
===================================================== */

.timer-card {

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius:
        24px;

    padding:
        50px 30px;

    margin-top:
        35px;

    text-align:
        center;

    box-shadow:
        0 10px 35px
        rgba(20,20,40,.05);

}


.timer {

    font-size:
        clamp(64px, 14vw, 110px);

    font-weight:
        800;

    letter-spacing:
        -4px;

    font-variant-numeric:
        tabular-nums;

}


.status {

    color:
        var(--text-secondary);

    font-size:
        14px;

    margin-top:
        12px;

}


.controls {

    display:
        flex;

    justify-content:
        center;

    gap:
        10px;

    margin-top:
        35px;

}


.button {

    border:
        1px solid var(--border);

    background:
        white;

    padding:
        12px 20px;

    border-radius:
        11px;

    font-weight:
        700;

}


.button.primary {

    background:
        var(--primary);

    border-color:
        var(--primary);

    color:
        white;

}


.button.success {

    background:
        var(--success);

    border-color:
        var(--success);

    color:
        white;

}


.button:disabled {

    opacity:
        .45;

    cursor:
        not-allowed;

}


/* =====================================================
   TASK
===================================================== */

.task-card {

    margin-top:
        20px;

    background:
        white;

    border:
        1px solid var(--border);

    border-radius:
        18px;

    padding:
        22px;

}


.task-label {

    color:
        var(--text-tertiary);

    font-size:
        11px;

    text-transform:
        uppercase;

    font-weight:
        800;

}


.task-title {

    font-size:
        19px;

    font-weight:
        750;

    margin-top:
        6px;

}


.task-select {

    width: 100%;

    margin-top:
        12px;

    padding:
        11px;

    border:
        1px solid var(--border);

    border-radius:
        10px;

    background:
        white;

}


/* =====================================================
   COMPLETE
===================================================== */

.complete {

    display:
        none;

    margin-top:
        20px;

    padding:
        18px;

    border-radius:
        14px;

    background:
        #e9f8ef;

    color:
        var(--success);

    font-weight:
        700;

}


.complete.show {

    display:
        block;

}


@media(max-width:600px) {

    .container {

        padding:
            40px 15px;

    }

    .timer-card {

        padding:
            40px 20px;

    }

    .controls {

        flex-direction:
            column;

    }

    .button {

        width:
            100%;

    }

}

</style>

</head>


<body>


<header class="topbar">


<div class="logo">

    <div class="logo-mark">
        T
    </div>

    Tempo

</div>


<button
    class="back-button"
    onclick="goHome()"
>
    ← Dashboard
</button>


</header>


<main class="container">


<div class="eyebrow">
    Focus Session
</div>


<h1>
    One task. One session.
</h1>


<p class="subtitle">
    Focus on the work. Tempo will handle the clock.
</p>


<div class="task-card">

    <div class="task-label">
        What are you working on?
    </div>


    <div
        class="task-title"
        id="selectedTaskTitle"
    >
        Free Study
    </div>


    <select
        class="task-select"
        id="taskSelect"
        onchange="changeTask()"
    >

        <option value="">
            Free Study
        </option>

    </select>

</div>


<div class="timer-card">


<div
    class="timer"
    id="timer"
>
    25:00
</div>


<div
    class="status"
    id="status"
>
    Ready to focus.
</div>


<div class="controls">


<button
    class="button primary"
    id="startButton"
    onclick="startTimer()"
>
    Start
</button>


<button
    class="button"
    id="pauseButton"
    onclick="pauseTimer()"
    disabled
>
    Pause
</button>


<button
    class="button"
    onclick="resetTimer()"
>
    Reset
</button>


</div>


<div
    class="complete"
    id="completeMessage"
>
    Session completed ✓
</div>


</div>


</main>


<script>

/* =====================================================
   CONFIG
===================================================== */

const TEMPO_API =
    "https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";


/* =====================================================
   USER
===================================================== */

const tempoUser =
    JSON.parse(
        localStorage.getItem(
            "tempoUser"
        )
    );


/* =====================================================
   TIMER
===================================================== */

const SESSION_LENGTH =
    25 * 60;


let remainingSeconds =
    SESSION_LENGTH;


let timerInterval =
    null;


let isRunning =
    false;


let sessionStartedAt =
    null;


let selectedTaskId =
    "";


/* =====================================================
   ELEMENTS
===================================================== */

const timerElement =
    document.getElementById(
        "timer"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const pauseButton =
    document.getElementById(
        "pauseButton"
    );


const taskSelect =
    document.getElementById(
        "taskSelect"
    );


const selectedTaskTitle =
    document.getElementById(
        "selectedTaskTitle"
    );


const completeMessage =
    document.getElementById(
        "completeMessage"
    );


/* =====================================================
   FORMAT TIMER
===================================================== */

function formatTime(seconds) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    return (
        String(minutes)
            .padStart(2, "0") +

        ":" +

        String(secs)
            .padStart(2, "0")
    );

}


function updateTimer() {

    timerElement.textContent =
        formatTime(
            remainingSeconds
        );

}


/* =====================================================
   START
===================================================== */

function startTimer() {

    if (isRunning) return;


    if (!sessionStartedAt) {

        sessionStartedAt =
            new Date()
                .toISOString();

    }


    isRunning = true;


    startButton.disabled =
        true;


    pauseButton.disabled =
        false;


    statusElement.textContent =
        "Focus mode is running.";


    timerInterval =
        setInterval(
            function() {

                remainingSeconds--;

                updateTimer();


                if (
                    remainingSeconds <= 0
                ) {

                    completeSession();

                }

            },
            1000
        );

}


/* =====================================================
   PAUSE
===================================================== */

function pauseTimer() {

    if (!isRunning) return;


    clearInterval(
        timerInterval
    );


    timerInterval =
        null;


    isRunning =
        false;


    startButton.disabled =
        false;


    pauseButton.disabled =
        true;


    statusElement.textContent =
        "Paused. Resume when ready.";

}


/* =====================================================
   RESET
===================================================== */

function resetTimer() {

    clearInterval(
        timerInterval
    );


    timerInterval =
        null;


    isRunning =
        false;


    remainingSeconds =
        SESSION_LENGTH;


    sessionStartedAt =
        null;


    startButton.disabled =
        false;


    pauseButton.disabled =
        true;


    statusElement.textContent =
        "Ready to focus.";


    completeMessage.classList
        .remove("show");


    updateTimer();

}


/* =====================================================
   COMPLETE
===================================================== */

async function completeSession() {

    clearInterval(
        timerInterval
    );


    timerInterval =
        null;


    isRunning =
        false;


    startButton.disabled =
        true;


    pauseButton.disabled =
        true;


    remainingSeconds =
        0;


    updateTimer();


    statusElement.textContent =
        "Session complete.";


    completeMessage.classList
        .add("show");


    if (!tempoUser) {

        console.warn(
            "No Tempo user found."
        );

        return;

    }


    try {

        await fetch(
            TEMPO_API,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify({

                        action:
                            "createSession",

                        userId:
                            tempoUser.user_id,

                        taskId:
                            selectedTaskId,

                        durationMinutes:
                            25,

                        startedAt:
                            sessionStartedAt,

                        completed:
                            true

                    })

            }
        );


        statusElement.textContent =
            "Session saved to Tempo ✓";

    }

    catch (error) {

        console.error(
            error
        );

        statusElement.textContent =
            "Session finished, but could not sync.";

    }

}


/* =====================================================
   LOAD TASKS
===================================================== */

async function loadTasks() {

    if (!tempoUser) return;


    try {

        const url =
            TEMPO_API +
            "?action=getTasks" +
            "&userId=" +
            encodeURIComponent(
                tempoUser.user_id
            );


        const response =
            await fetch(url);


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.error
            );

        }


        const tasks =
            result.data.tasks || [];


        tasks.forEach(
            function(task) {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    task.task_id;


                option.textContent =
                    task.title;


                taskSelect.appendChild(
                    option
                );

            }
        );

    }

    catch (error) {

        console.error(
            "Could not load tasks:",
            error
        );

    }

}


/* =====================================================
   CHANGE TASK
===================================================== */

function changeTask() {

    selectedTaskId =
        taskSelect.value;


    const option =
        taskSelect.options[
            taskSelect.selectedIndex
        ];


    selectedTaskTitle.textContent =
        option
            ? option.textContent
            : "Free Study";

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome() {

    window.location.href =
        "index.html";

}


/* =====================================================
   INITIALIZE
===================================================== */

updateTimer();

loadTasks();

</script>

</body>

</html>
