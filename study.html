<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary: #6657e8;
    --primary-light: #efedff;
    --background: #f7f8fc;
    --surface: #ffffff;
    --text: #17191c;
    --secondary: #737681;
    --border: #e8e8ee;
    --danger: #e05252;
    --success: #28a866;
}

body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--background);
    color: var(--text);
    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

.auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.auth-card {
    width: 100%;
    max-width: 440px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 38px;
    box-shadow: 0 15px 50px rgba(20,20,40,.08);
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 35px;
}

.logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
}

.logo-name {
    font-size: 25px;
    font-weight: 800;
}

h1 {
    font-size: 30px;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 8px;
    color: var(--secondary);
    font-size: 14px;
    line-height: 1.5;
}

.form {
    margin-top: 28px;
}

.field {
    margin-bottom: 16px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 7px;
}

input {
    width: 100%;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 11px;
    padding: 13px 14px;
    outline: none;
}

input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}

.primary {
    width: 100%;
    border: none;
    background: var(--primary);
    color: white;
    padding: 13px;
    border-radius: 11px;
    font-weight: 700;
    margin-top: 5px;
}

.primary:hover {
    opacity: .92;
}

.switch {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: var(--secondary);
}

.switch button {
    border: none;
    background: none;
    color: var(--primary);
    font-weight: 700;
}

.error {
    background: #fff0f0;
    color: var(--danger);
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 12px;
    margin-top: 15px;
    display: none;
}

.success {
    background: #e9f8ef;
    color: var(--success);
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 12px;
    margin-top: 15px;
    display: none;
}

#signupForm {
    display: none;
}

.small {
    margin-top: 18px;
    color: #a2a4ad;
    font-size: 11px;
    text-align: center;
}
</style>
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo">
            <div class="logo-mark">T</div>
            <div class="logo-name">Tempo</div>
        </div>

        <!-- LOGIN -->

        <div id="loginForm">

            <h1>Welcome back.</h1>

            <p class="subtitle">
                Your time is valuable. Tempo helps you use it better.
            </p>

            <div class="form">

                <div class="field">
                    <label>USERNAME</label>
                    <input
                        id="loginUsername"
                        type="text"
                        autocomplete="username"
                        placeholder="your_username"
                    >
                </div>

                <div class="field">
                    <label>PASSWORD</label>
                    <input
                        id="loginPassword"
                        type="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                    >
                </div>

                <button
                    class="primary"
                    onclick="login()"
                >
                    Log In
                </button>

                <div id="loginError" class="error"></div>

            </div>

            <div class="switch">
                Don't have an account?
                <button onclick="showSignup()">
                    Create one
                </button>
            </div>

        </div>


        <!-- SIGNUP -->

        <div id="signupForm">

            <h1>Create your Tempo.</h1>

            <p class="subtitle">
                Make an account and start taking control of your time.
            </p>

            <div class="form">

                <div class="field">
                    <label>DISPLAY NAME</label>
                    <input
                        id="signupDisplayName"
                        type="text"
                        placeholder="Alex"
                    >
                </div>

                <div class="field">
                    <label>USERNAME</label>
                    <input
                        id="signupUsername"
                        type="text"
                        placeholder="alex_123"
                    >
                </div>

                <div class="field">
                    <label>PASSWORD</label>
                    <input
                        id="signupPassword"
                        type="password"
                        placeholder="At least 6 characters"
                    >
                </div>

                <button
                    class="primary"
                    onclick="signup()"
                >
                    Create Account
                </button>

                <div id="signupError" class="error"></div>

                <div id="signupSuccess" class="success"></div>

            </div>

            <div class="switch">
                Already have an account?
                <button onclick="showLogin()">
                    Log in
                </button>
            </div>

        </div>

        <div class="small">
            Tempo · Giving People Their Time Back
        </div>

    </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";


function showSignup() {

    document.getElementById("loginForm").style.display = "none";

    document.getElementById("signupForm").style.display = "block";

}


function showLogin() {

    document.getElementById("signupForm").style.display = "none";

    document.getElementById("loginForm").style.display = "block";

}


function showError(id, message) {

    const box = document.getElementById(id);

    box.textContent = message;

    box.style.display = "block";

}


function clearMessages() {

    document
        .querySelectorAll(".error, .success")
        .forEach(element => {
            element.style.display = "none";
        });

}


async function api(action, data = {}) {

    const response = await fetch(API_URL, {

        method: "POST",

        headers: {
            "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
            action,
            ...data
        })

    });

    return await response.json();

}


async function signup() {

    clearMessages();

    const displayName =
        document.getElementById("signupDisplayName").value.trim();

    const username =
        document.getElementById("signupUsername").value.trim();

    const password =
        document.getElementById("signupPassword").value;


    if (!displayName) {

        showError(
            "signupError",
            "Please enter a display name."
        );

        return;

    }


    if (!username) {

        showError(
            "signupError",
            "Please choose a username."
        );

        return;

    }


    if (!password) {

        showError(
            "signupError",
            "Please choose a password."
        );

        return;

    }


    try {

        const result = await api(
            "createUser",
            {
                username,
                password,
                displayName
            }
        );


        if (!result.success) {

            const errors = {

                USERNAME_EXISTS:
                    "That username already exists.",

                USERNAME_REQUIRED:
                    "Please enter a username.",

                USERNAME_TOO_SHORT:
                    "Username must be at least 3 characters.",

                INVALID_USERNAME:
                    "Username can only contain letters, numbers and underscores.",

                PASSWORD_REQUIRED:
                    "Please enter a password.",

                PASSWORD_TOO_SHORT:
                    "Password must be at least 6 characters."

            };


            showError(
                "signupError",
                errors[result.error] ||
                "Something went wrong."
            );

            return;

        }


        document.getElementById(
            "signupSuccess"
        ).textContent =
            "Account created! Redirecting...";


        document.getElementById(
            "signupSuccess"
        ).style.display = "block";


        localStorage.setItem(
            "tempoUser",
            JSON.stringify(result)
        );


        setTimeout(() => {

            window.location.href = "study.html";

        }, 800);


    } catch (error) {

        showError(
            "signupError",
            "Could not connect to Tempo."
        );

    }

}


async function login() {

    clearMessages();

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!username || !password) {

        showError(
            "loginError",
            "Enter your username and password."
        );

        return;

    }


    try {

        const result = await api(
            "login",
            {
                username,
                password
            }
        );


        if (!result.success) {

            showError(
                "loginError",
                "Incorrect username or password."
            );

            return;

        }


        localStorage.setItem(
            "tempoUser",
            JSON.stringify(result)
        );


        window.location.href = "study.html";


    } catch (error) {

        showError(
            "loginError",
            "Could not connect to Tempo."
        );

    }

}

</script>

</body>
</html>
