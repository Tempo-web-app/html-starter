<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Tempo · Schedule</title>

<style>

:root {

    --primary: #6657e8;
    --primary-light: #efedff;

    --background: #f7f8fc;
    --surface: #ffffff;

    --text: #17191c;
    --text-secondary: #737681;
    --text-tertiary: #a2a4ad;

    --border: #e8e8ee;

    --success: #28a866;
    --success-light: #e9f8ef;

    --warning: #e49b27;
    --warning-light: #fff5df;

    --danger: #e05252;
    --danger-light: #fff0f0;

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;

    --shadow-sm:
        0 2px 8px rgba(20,20,40,0.04);

    --shadow-md:
        0 10px 30px rgba(20,20,40,0.08);

}

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}

body {

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--background);

    color: var(--text);

    min-height: 100vh;

}

button,
input,
select {

    font: inherit;

}

button {

    cursor: pointer;

}


/* =========================================
   TOPBAR
========================================= */

.topbar {

    height: 72px;

    background:
        rgba(255,255,255,0.92);

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 34px;

    position: sticky;

    top: 0;

    z-index: 20;

}

.logo {

    display: flex;

    align-items: center;

    gap: 10px;

    font-weight: 800;

    font-size: 21px;

}

.logo-mark {

    width: 34px;
    height: 34px;

    border-radius: 10px;

    background: var(--primary);

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

}

.top-actions {

    display: flex;

    gap: 10px;

}

.icon-button {

    width: 38px;
    height: 38px;

    border:
        1px solid var(--border);

    background: white;

    border-radius: 10px;

}


/* =========================================
   CONTENT
========================================= */

.content {

    max-width: 1250px;

    margin: auto;

    padding:
        38px 30px 80px;

}


/* =========================================
   HEADER
========================================= */

.page-header {

    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    gap: 20px;

    margin-bottom: 28px;

}

.eyebrow {

    color: var(--primary);

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 0.08em;

    margin-bottom: 7px;

}

h1 {

    font-size: 32px;

    letter-spacing: -1px;

}

.subtitle {

    margin-top: 8px;

    color: var(--text-secondary);

    font-size: 14px;

}

.header-buttons {

    display: flex;

    gap: 10px;

}

.primary-button {

    border: none;

    background: var(--primary);

    color: white;

    padding:
        11px 17px;

    border-radius: 10px;

    font-size: 13px;

    font-weight: 750;

}

.primary-button:hover {

    box-shadow:
        0 7px 18px
        rgba(102,87,232,0.25);

}

.secondary-button {

    border:
        1px solid var(--border);

    background: white;

    color: var(--text);

    padding:
        11px 17px;

    border-radius: 10px;

    font-size: 13px;

    font-weight: 650;

}


/* =========================================
   DATE NAVIGATION
========================================= */

.date-bar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;

}

.date-navigation {

    display: flex;

    align-items: center;

    gap: 8px;

}

.date-button {

    width: 38px;
    height: 38px;

    border:
        1px solid var(--border);

    background: white;

    border-radius: 10px;

}

.current-date {

    padding:
        10px 15px;

    border:
        1px solid var(--border);

    background: white;

    border-radius: 10px;

    font-size: 13px;

    font-weight: 700;

}

.today-button {

    border: none;

    background: var(--primary-light);

    color: var(--primary);

    padding:
        9px 13px;

    border-radius: 9px;

    font-size: 12px;

    font-weight: 750;

}


/* =========================================
   SUMMARY
========================================= */

.summary-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 14px;

    margin-bottom: 20px;

}

.summary-card {

    background: white;

    border:
        1px solid var(--border);

    border-radius: var(--radius-md);

    padding: 18px;

}

.summary-label {

    color: var(--text-tertiary);

    font-size: 11px;

}

.summary-value {

    font-size: 23px;

    font-weight: 800;

    margin-top: 7px;

}

.summary-small {

    color: var(--text-secondary);

    font-size: 11px;

    margin-top: 3px;

}


/* =========================================
   SCHEDULE
========================================= */

.schedule-card {

    background: white;

    border:
        1px solid var(--border);

    border-radius: var(--radius-lg);

    overflow: hidden;

    box-shadow: var(--shadow-sm);

}

.schedule-header {

    padding:
        20px 22px;

    border-bottom:
        1px solid var(--border);

    display: flex;

    justify-content: space-between;

    align-items: center;

}

.schedule-title {

    font-size: 15px;

    font-weight: 800;

}

.schedule-description {

    color: var(--text-tertiary);

    font-size: 11px;

    margin-top: 4px;

}

.timeline {

    padding:
        10px 22px 25px;

}

.timeline-item {

    display: grid;

    grid-template-columns:
        72px 22px 1fr;

    min-height: 90px;

}

.timeline-time {

    color: var(--text-tertiary);

    font-size: 12px;

    padding-top: 18px;

}

.timeline-line {

    position: relative;

}

.timeline-line::before {

    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: var(--border);

    top: 20px;

    left: 1px;

    z-index: 2;

}

.timeline-line::after {

    content: "";

    position: absolute;

    width: 1px;

    background: var(--border);

    top: 30px;

    bottom: -5px;

    left: 5px;

}

.timeline-item:last-child
.timeline-line::after {

    display: none;

}

.timeline-item.study
.timeline-line::before {

    background: var(--primary);

    box-shadow:
        0 0 0 4px var(--primary-light);

}

.timeline-item.study
.timeline-title {

    color: var(--primary);

}

.timeline-item.deadline
.timeline-line::before {

    background: var(--danger);

}

.timeline-content {

    padding:
        14px 0 20px;

}

.timeline-title {

    font-size: 14px;

    font-weight: 750;

}

.timeline-description {

    color: var(--text-secondary);

    font-size: 12px;

    margin-top: 5px;

}

.timeline-meta {

    display: flex;

    gap: 7px;

    margin-top: 8px;

    flex-wrap: wrap;

}

.tag {

    display: inline-flex;

    align-items: center;

    padding:
        4px 8px;

    border-radius: 7px;

    font-size: 10px;

    font-weight: 700;

    background: var(--background);

    color: var(--text-secondary);

}

.tag.primary {

    background: var(--primary-light);

    color: var(--primary);

}

.tag.danger {

    background: var(--danger-light);

    color: var(--danger);

}

.empty {

    padding: 70px 25px;

    text-align: center;

}

.empty-icon {

    width: 60px;
    height: 60px;

    border-radius: 17px;

    background: var(--primary-light);

    color: var(--primary);

    display: flex;

    align-items: center;

    justify-content: center;

    margin:
        0 auto 16px;

    font-size: 25px;

}

.empty h2 {

    font-size: 19px;

}

.empty p {

    color: var(--text-secondary);

    font-size: 13px;

    max-width: 400px;

    margin:
        8px auto 0;

    line-height: 1.6;

}


/* =========================================
   LOADING
========================================= */

.loading {

    padding: 70px;

    text-align: center;

    color: var(--text-secondary);

    font-size: 13px;

}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:700px) {

    .topbar {

        padding:
            0 18px;

    }

    .content {

        padding:
            28px 18px 60px;

    }

    .page-header {

        align-items: flex-start;

        flex-direction: column;

    }

    .summary-grid {

        grid-template-columns: 1fr;

    }

    .date-bar {

        align-items: flex-start;

        flex-direction: column;

        gap: 10px;

    }

    .timeline-item {

        grid-template-columns:
            55px 18px 1fr;

    }

}


/* =========================================
   TOAST
========================================= */

.toast {

    position: fixed;

    bottom: 25px;

    right: 25px;

    background: #17191c;

    color: white;

    padding:
        12px 16px;

    border-radius: 10px;

    font-size: 12px;

    opacity: 0;

    transform:
        translateY(10px);

    pointer-events: none;

    transition: 0.2s ease;

    z-index: 100;

}

.toast.show {

    opacity: 1;

    transform:
        translateY(0);

}

</style>

</head>


<body>


<header class="topbar">

    <div class="logo">

        <div class="logo-mark">
            T
        </div>

        Tempo

    </div>


    <div class="top-actions">

        <button
            class="icon-button"
            onclick="goHome()"
        >
            ←
        </button>

    </div>

</header>



<main class="content">


    <div class="page-header">

        <div>

            <div class="eyebrow">
                Planning
            </div>

            <h1>
                Schedule
            </h1>

            <p class="subtitle">
                Tempo organizes your workload around
                what matters most.
            </p>

        </div>


        <div class="header-buttons">

            <button
                class="secondary-button"
                onclick="goToday()"
            >
                Today
            </button>

            <button
                class="primary-button"
                onclick="generateSchedule()"
            >
                ✦ Rebuild Schedule
            </button>

        </div>

    </div>



    <div class="date-bar">

        <div class="date-navigation">

            <button
                class="date-button"
                onclick="changeDay(-1)"
            >
                ←
            </button>

            <div
                class="current-date"
                id="currentDate"
            >
                Loading...
            </div>

            <button
                class="date-button"
                onclick="changeDay(1)"
            >
                →
            </button>

        </div>


        <button
            class="today-button"
            onclick="goToday()"
        >
            Jump to today
        </button>

    </div>



    <div class="summary-grid">

        <div class="summary-card">

            <div class="summary-label">
                Study time
            </div>

            <div
                class="summary-value"
                id="studyTime"
            >
                0m
            </div>

            <div class="summary-small">
                scheduled today
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Tasks
            </div>

            <div
                class="summary-value"
                id="taskCount"
            >
                0
            </div>

            <div class="summary-small">
                planned today
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Urgency
            </div>

            <div
                class="summary-value"
                id="urgency"
            >
                —
            </div>

            <div class="summary-small">
                based on upcoming deadlines
            </div>

        </div>

    </div>



    <div class="schedule-card">


        <div class="schedule-header">

            <div>

                <div class="schedule-title">
                    Today's Plan
                </div>

                <div class="schedule-description">
                    Generated from your tasks and deadlines
                </div>

            </div>

        </div>


        <div id="scheduleContainer">

            <div class="loading">
                Loading your schedule...
            </div>

        </div>


    </div>


</main>



<div
    class="toast"
    id="toast"
></div>



<script>

/* =========================================================
   TEMPO CONFIG
========================================================= */

const API_URL =
    "https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";


/* =========================================================
   STATE
========================================================= */

let selectedDate =
    new Date();

let tasks = [];

let tests = [];

let generatedSchedule = [];


/* =========================================================
   AUTH
========================================================= */

function getToken() {

    /*
       This checks several common keys so the page
       can work with the login page you've already made.
    */

    return (
        localStorage.getItem("tempoToken") ||
        localStorage.getItem("token") ||
        localStorage.getItem("tempo_token") ||
        ""
    );

}


function requireLogin() {

    const token =
        getToken();

    if (!token) {

        window.location.href =
            "index.html";

        return false;

    }

    return true;

}


/* =========================================================
   API
========================================================= */

async function api(action, extra = {}) {

    const token =
        getToken();


    const response =
        await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify({
                        action: action,
                        token: token,
                        ...extra
                    })
            }
        );


    const data =
        await response.json();


    if (
        data.error === "UNAUTHORIZED"
    ) {

        localStorage.removeItem(
            "tempoToken"
        );

        localStorage.removeItem(
            "token"
        );

        window.location.href =
            "index.html";

        return null;

    }


    return data;

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {

    if (!requireLogin()) {
        return;
    }


    try {

        const [
            taskResult,
            testResult
        ] = await Promise.all([

            api("getTasks"),

            api("getTests")

        ]);


        if (
            taskResult &&
            taskResult.success
        ) {

            tasks =
                taskResult.tasks || [];

        }


        if (
            testResult &&
            testResult.success
        ) {

            tests =
                testResult.tests || [];

        }


        generateSchedule();

    }

    catch(error) {

        console.error(error);

        showToast(
            "Couldn't load your Tempo data."
        );

        renderEmpty(
            "Something went wrong.",
            "Tempo couldn't retrieve your tasks and tests."
        );

    }

}


/* =========================================================
   DATE HELPERS
========================================================= */

function dateOnly(date) {

    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );

}


function formatDate(date) {

    return date.toLocaleDateString(
        "en-US",
        {
            weekday: "long",
            month: "long",
            day: "numeric"
        }
    );

}


function dateKey(date) {

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            date.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


function changeDay(amount) {

    selectedDate.setDate(
        selectedDate.getDate() + amount
    );

    renderDate();

    generateSchedule();

}


function goToday() {

    selectedDate =
        new Date();

    renderDate();

    generateSchedule();

}


function renderDate() {

    document
        .getElementById("currentDate")
        .textContent =
        formatDate(selectedDate);

}


/* =========================================================
   DEADLINE PARSING
========================================================= */

function parseDeadline(value) {

    if (!value) {
        return null;
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return null;

    }


    return date;

}


/* =========================================================
   PRIORITY
========================================================= */

function calculatePriority(task) {

    const deadline =
        parseDeadline(
            task.deadline
        );


    let score = 0;


    if (deadline) {

        const today =
            dateOnly(
                selectedDate
            );

        const deadlineDay =
            dateOnly(
                deadline
            );


        const days =
            Math.ceil(
                (
                    deadlineDay -
                    today
                ) /
                86400000
            );


        if (days <= 0) {

            score += 100;

        }

        else if (days === 1) {

            score += 80;

        }

        else if (days === 2) {

            score += 65;

        }

        else if (days <= 4) {

            score += 50;

        }

        else if (days <= 7) {

            score += 30;

        }

        else {

            score += 10;

        }

    }


    const difficulty =
        String(
            task.difficulty || ""
        ).toLowerCase();


    if (
        difficulty === "hard" ||
        difficulty === "difficult"
    ) {

        score += 25;

    }

    else if (
        difficulty === "medium"
    ) {

        score += 12;

    }


    return score;

}


/* =========================================================
   TASK ELIGIBILITY
========================================================= */

function getTasksForDate() {

    const day =
        dateOnly(
            selectedDate
        );


    return tasks
        .filter(function(task) {

            if (task.completed) {
                return false;
            }


            const deadline =
                parseDeadline(
                    task.deadline
                );


            if (!deadline) {

                return true;

            }


            /*
               Do not schedule work after its deadline.
            */

            const deadlineDay =
                dateOnly(
                    deadline
                );


            return (
                day <= deadlineDay
            );

        })
        .sort(function(a,b) {

            return (
                calculatePriority(b) -
                calculatePriority(a)
            );

        });

}


/* =========================================================
   SCHEDULING ENGINE
========================================================= */

function generateSchedule() {

    generatedSchedule = [];


    const availableTasks =
        getTasksForDate();


    /*
       Tempo's default study window.

       This is intentionally kept simple for now.
       Later, Settings will provide the user's
       actual available hours.
    */

    const startHour = 17;

    const endHour = 22;


    let currentMinutes =
        startHour * 60;


    const endMinutes =
        endHour * 60;


    /*
       First add upcoming tests as urgency context.
    */

    const upcomingTests =
        tests
            .filter(function(test) {

                const date =
                    parseDeadline(
                        test.date
                    );


                if (!date) {
                    return false;
                }


                return (
                    dateOnly(date) >=
                    dateOnly(selectedDate)
                );

            })
            .sort(function(a,b) {

                return (
                    parseDeadline(a.date) -
                    parseDeadline(b.date)
                );

            });


    /*
       Generate study blocks.
    */

    for (
        let i = 0;
        i < availableTasks.length;
        i++
    ) {

        const task =
            availableTasks[i];


        let duration =
            Number(
                task.minutes
            );


        if (
            !duration ||
            duration < 5
        ) {

            duration = 30;

        }


        /*
           Don't create a block beyond the
           available study window.
        */

        if (
            currentMinutes >=
            endMinutes
        ) {

            break;

        }


        const remaining =
            endMinutes -
            currentMinutes;


        duration =
            Math.min(
                duration,
                remaining
            );


        /*
           Avoid tiny useless blocks.
        */

        if (
            duration < 15
        ) {

            break;

        }


        generatedSchedule.push({

            type: "study",

            task: task,

            start:
                minutesToTime(
                    currentMinutes
                ),

            end:
                minutesToTime(
                    currentMinutes +
                    duration
                ),

            minutes: duration

        });


        currentMinutes += duration;


        /*
           Add a 10-minute break after
           each substantial study block.
        */

        if (
            currentMinutes <
            endMinutes
        ) {

            generatedSchedule.push({

                type: "break",

                start:
                    minutesToTime(
                        currentMinutes
                    ),

                end:
                    minutesToTime(
                        currentMinutes +
                        10
                    ),

                minutes: 10

            });


            currentMinutes += 10;

        }

    }


    /*
       If nothing exists, don't invent work.
    */

    renderSchedule(
        generatedSchedule,
        upcomingTests
    );

}


/* =========================================================
   TIME
========================================================= */

function minutesToTime(total) {

    const hour =
        Math.floor(
            total / 60
        );

    const minute =
        total % 60;


    const suffix =
        hour >= 12
            ? "PM"
            : "AM";


    const displayHour =
        hour % 12 || 12;


    return (
        String(displayHour) +
        ":" +
        String(minute).padStart(2,"0") +
        " " +
        suffix
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderSchedule(
    schedule,
    upcomingTests
) {

    const container =
        document.getElementById(
            "scheduleContainer"
        );


    const studyBlocks =
        schedule.filter(function(item) {

            return item.type === "study";

        });


    const studyMinutes =
        studyBlocks.reduce(
            function(total,item) {

                return total + item.minutes;

            },
            0
        );


    document
        .getElementById("studyTime")
        .textContent =
        formatMinutes(
            studyMinutes
        );


    document
        .getElementById("taskCount")
        .textContent =
        studyBlocks.length;


    document
        .getElementById("urgency")
        .textContent =
        getUrgency(
            upcomingTests
        );


    if (
        schedule.length === 0
    ) {

        renderEmpty(
            "Your schedule is clear.",
            "Tempo doesn't have any unfinished work to schedule for this day."
        );

        return;

    }


    let html =
        '<div class="timeline">';


    schedule.forEach(
        function(item) {

            if (
                item.type === "break"
            ) {

                html += `

                    <div class="timeline-item">

                        <div class="timeline-time">
                            ${item.start}
                        </div>

                        <div class="timeline-line"></div>

                        <div class="timeline-content">

                            <div class="timeline-title">
                                ☕ Break
                            </div>

                            <div class="timeline-description">
                                ${item.minutes} minutes
                            </div>

                        </div>

                    </div>

                `;

                return;

            }


            const task =
                item.task;


            const deadline =
                parseDeadline(
                    task.deadline
                );


            let deadlineText = "";


            if (deadline) {

                deadlineText =
                    "Due " +
                    deadline.toLocaleDateString(
                        "en-US",
                        {
                            month: "short",
                            day: "numeric"
                        }
                    );

            }


            const priority =
                calculatePriority(
                    task
                );


            let priorityTag =
                "";


            if (
                priority >= 80
            ) {

                priorityTag =
                    '<span class="tag danger">High priority</span>';

            }

            else if (
                priority >= 50
            ) {

                priorityTag =
                    '<span class="tag primary">Priority</span>';

            }


            html += `

                <div class="timeline-item study">

                    <div class="timeline-time">
                        ${item.start}
                    </div>

                    <div class="timeline-line"></div>

                    <div class="timeline-content">

                        <div class="timeline-title">
                            ${escapeHTML(task.subject || "Study")}
                            ·
                            ${escapeHTML(task.title)}
                        </div>

                        <div class="timeline-description">

                            ${item.minutes} minutes

                        </div>

                        <div class="timeline-meta">

                            <span class="tag primary">
                                Study
                            </span>

                            ${
                                task.difficulty
                                ?
                                `<span class="tag">
                                    ${escapeHTML(task.difficulty)}
                                </span>`
                                :
                                ""
                            }

                            ${
                                deadlineText
                                ?
                                `<span class="tag">
                                    ${deadlineText}
                                </span>`
                                :
                                ""
                            }

                            ${priorityTag}

                        </div>

                    </div>

                </div>

            `;

        }
    );


    /*
       Show upcoming tests below today's
       actual study schedule.
    */

    if (
        upcomingTests.length > 0
    ) {

        html += `

            <div
                style="
                    margin-top:20px;
                    padding-top:20px;
                    border-top:1px solid var(--border);
                "
            >

                <div
                    style="
                        font-size:12px;
                        font-weight:800;
                        margin-bottom:12px;
                    "
                >
                    Upcoming tests
                </div>

        `;


        upcomingTests
            .slice(0,3)
            .forEach(
                function(test) {

                    const date =
                        parseDeadline(
                            test.date
                        );


                    html += `

                        <div
                            style="
                                display:flex;
                                justify-content:space-between;
                                padding:10px 0;
                                border-bottom:1px solid var(--border);
                                font-size:12px;
                            "
                        >

                            <span>

                                📝
                                ${escapeHTML(
                                    test.subject ||
                                    ""
                                )}

                                ·

                                ${escapeHTML(
                                    test.title ||
                                    ""
                                )}

                            </span>

                            <span
                                style="
                                    color:var(--danger);
                                    font-weight:700;
                                "
                            >

                                ${
                                    date
                                    ?
                                    date.toLocaleDateString(
                                        "en-US",
                                        {
                                            month:"short",
                                            day:"numeric"
                                        }
                                    )
                                    :
                                    ""
                                }

                            </span>

                        </div>

                    `;

                }
            );


        html += "</div>";

    }


    html += "</div>";


    container.innerHTML =
        html;

}


/* =========================================================
   EMPTY

function renderEmpty(

    description
) {

        .getElementById(

        )
        .innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ✦
                </div>

                <h2>
                    ${escapeHTML(title)}
                </h2>

                <p>
                    ${escapeHTML(description)}
                </p>

            </div>

        `;

}


/* =========================================================
   FORMAT MINUTES
========================================================= */

function formatMinutes(minutes) {

    if (
        minutes < 60
    ) {

        return minutes + "m";

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    const remaining =
        minutes % 60;


    if (
        remaining === 0
    ) {

        return hours + "h";

    }


    return (
        hours +
        "h " +
        remaining +
        "m"
    );

}


/* =========================================================
   URGENCY
========================================================= */

function getUrgency(
    upcomingTests
) {

    if (
        upcomingTests.length === 0
    ) {

        return "Low";

    }


    const nearest =
        parseDeadline(
            upcomingTests[0].date
        );


    if (!nearest) {

        return "Normal";

    }


    const days =
        Math.ceil(
            (
                dateOnly(nearest) -
                dateOnly(selectedDate)
            ) /
            86400000
        );


    if (
        days <= 1
    ) {

        return "High";

    }


    if (
        days <= 3
    ) {

        return "Medium";

    }


    return "Low";

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   NAVIGATION
========================================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function() {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}
