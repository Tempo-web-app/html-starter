<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tempo - Schedule</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Inter, Arial, sans-serif;
  background: #f7f8fa;
  color: #171717;
}

header {
  height: 70px;
  background: white;
  border-bottom: 1px solid #e5e7eb;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 32px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: #555;

  padding: 9px 14px;
  border-radius: 9px;

  font-size: 14px;
}

nav a:hover,
nav a.active {
  background: #f0f1f3;
  color: #111;
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 20px;
}

.hero {
  margin-bottom: 28px;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 8px;
}

.hero p {
  color: #666;
}

.card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;

  padding: 24px;
  margin-bottom: 20px;
}

.card h2 {
  margin-bottom: 20px;
  font-size: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;

  padding: 12px;

  border: 1px solid #d6d9de;
  border-radius: 9px;

  font-size: 15px;
  background: white;
}

input:focus {
  outline: none;
  border-color: #111;
}

button {
  border: none;
  border-radius: 10px;

  padding: 12px 18px;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}

.primary {
  background: #111;
  color: white;
}

.primary:hover {
  opacity: 0.85;
}

.primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.generate {
  margin-top: 20px;
  width: 100%;
}

.status {
  margin-top: 15px;

  padding: 12px;

  border-radius: 9px;

  display: none;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.status.loading {
  display: block;
  background: #f0f1f3;
  color: #444;
}

.schedule {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.schedule-item {
  border: 1px solid #e5e7eb;
  border-radius: 12px;

  padding: 16px;

  display: grid;
  grid-template-columns: 120px 1fr auto;

  gap: 16px;
  align-items: center;
}

.time {
  font-weight: 700;
  font-size: 14px;
}

.schedule-main {
  min-width: 0;
}

.schedule-subject {
  font-size: 13px;
  color: #666;
  margin-bottom: 4px;
}

.schedule-task {
  font-size: 16px;
  font-weight: 700;
}

.schedule-minutes {
  font-size: 13px;
  color: #666;
  white-space: nowrap;
}

.empty {
  text-align: center;
  padding: 40px;
  color: #777;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #777;
}

.summary {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.summary-item {
  background: #f0f1f3;
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 13px;
  font-weight: 600;
}

.task-preview {
  margin-top: 20px;
  border-top: 1px solid #eee;
  padding-top: 20px;
}

.task-preview h3 {
  font-size: 15px;
  margin-bottom: 12px;
}

.preview-item {
  display: flex;
  justify-content: space-between;
  gap: 15px;

  padding: 10px 0;

  border-bottom: 1px solid #f0f0f0;

  font-size: 14px;
}

.preview-item:last-child {
  border-bottom: none;
}

.completed {
  color: #888;
  text-decoration: line-through;
}

@media (max-width: 700px) {

  header {
    height: auto;
    min-height: 70px;
    padding: 14px 16px;

    gap: 10px;
    flex-direction: column;
    align-items: flex-start;
  }

  nav {
    width: 100%;
    overflow-x: auto;
  }

  .container {
    margin-top: 25px;
  }

  .hero h1 {
    font-size: 30px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .schedule-item {
    grid-template-columns: 1fr;
    gap: 7px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    Tempo
  </div>

  <nav>

    <a href="dashboard.html">
      Dashboard
    </a>

    <a href="tasks.html">
      Tasks
    </a>

    <a href="tests.html">
      Tests
    </a>

    <a href="schedule.html" class="active">
      Schedule
    </a>

    <a href="share.html">
      Share
    </a>

  </nav>

</header>


<main class="container">

  <section class="hero">

    <h1>AI Schedule</h1>

    <p>
      Let Tempo build a realistic study schedule from your tasks and upcoming tests.
    </p>

  </section>


  <!-- SETTINGS -->

  <section class="card">

    <h2>Build your schedule</h2>

    <div class="form-grid">

      <div class="field">

        <label for="date">
          Date
        </label>

        <input
          id="date"
          type="date"
        >

      </div>


      <div class="field">

        <label for="breakMinutes">
          Break length
        </label>

        <input
          id="breakMinutes"
          type="number"
          min="0"
          max="60"
          value="10"
        >

      </div>


      <div class="field">

        <label for="availableStart">
          Available from
        </label>

        <input
          id="availableStart"
          type="time"
          value="17:00"
        >

      </div>


      <div class="field">

        <label for="availableEnd">
          Available until
        </label>

        <input
          id="availableEnd"
          type="time"
          value="21:00"
        >

      </div>

    </div>


    <button
      id="generateButton"
      class="primary generate"
      onclick="generateSchedule()"
    >
      Generate AI Schedule
    </button>


    <div
      id="status"
      class="status"
    ></div>


    <div class="task-preview">

      <h3>
        Your unfinished tasks
      </h3>

      <div id="taskPreview">

        <div class="loading">
          Loading tasks...
        </div>

      </div>

    </div>

  </section>


  <!-- SCHEDULE -->

  <section class="card">

    <h2>Your schedule</h2>

    <div id="schedule">

      <div class="empty">
        Your AI-generated schedule will appear here.
      </div>

    </div>

  </section>

</main>


<script>

/* =========================================================
   TEMPO API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzHIO3PeuWZfLWxWBUIaoaTi3YRFH-3oDcjCT5l77TBiC0vT1e-WCTqxlcYzxYeJUdK/exec";


/* =========================================================
   AUTH
========================================================= */

const token =
  localStorage.getItem("tempoToken");


if (!token) {

  window.location.href =
    "index.html";

}


/* =========================================================
   API FUNCTION
========================================================= */

async function api(
  action,
  data = {}
) {

  const response =
    await fetch(
      API_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify({

            action:
              action,

            ...data

          })

      }
    );


  if (!response.ok) {

    throw new Error(
      "Server request failed."
    );

  }


  return await response.json();

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


/* =========================================================
   TODAY
========================================================= */

function setDefaultDate() {

  const input =
    document.getElementById("date");


  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2, "0");


  const day =
    String(
      now.getDate()
    ).padStart(2, "0");


  input.value =
    `${year}-${month}-${day}`;

}


/* =========================================================
   WEEKDAY
========================================================= */

function getWeekday(dateString) {

  const date =
    new Date(
      dateString + "T12:00:00"
    );


  return date.toLocaleDateString(
    "en-US",
    {
      weekday: "long"
    }
  );

}


/* =========================================================
   LOAD TASKS
========================================================= */

async function loadTasks() {

  const container =
    document.getElementById(
      "taskPreview"
    );


  try {

    const result =
      await api(
        "getTasks",
        {
          token: token
        }
      );


    if (!result.success) {

      if (
        result.error ===
        "UNAUTHORIZED"
      ) {

        localStorage.removeItem(
          "tempoToken"
        );

        window.location.href =
          "index.html";

        return;

      }


      throw new Error(
        result.error ||
        "Could not load tasks."
      );

    }


    const tasks =
      result.tasks || [];


    const unfinished =
      tasks.filter(
        task =>
          !task.completed
      );


    if (!unfinished.length) {

      container.innerHTML = `
        <div class="empty">
          You have no unfinished tasks.
        </div>
      `;

      return;

    }


    container.innerHTML =
      unfinished
        .map(task => {

          return `

            <div class="preview-item">

              <span>

                <strong>
                  ${escapeHTML(
                    task.subject
                  )}
                </strong>

                ·

                ${escapeHTML(
                  task.title
                )}

              </span>

              <span>

                ${Number(
                  task.minutes || 0
                )} min

              </span>

            </div>

          `;

        })
        .join("");

  }

  catch(error) {

    container.innerHTML = `

      <div class="empty">

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
   LOAD TESTS
========================================================= */

async function loadTests() {

  const result =
    await api(
      "getTests",
      {
        token: token
      }
    );


  if (!result.success) {

    if (
      result.error ===
      "UNAUTHORIZED"
    ) {

      localStorage.removeItem(
        "tempoToken"
      );

      window.location.href =
        "index.html";

      return [];

    }


    throw new Error(
      result.error ||
      "Could not load tests."
    );

  }


  return result.tests || [];

}


/* =========================================================
   GENERATE SCHEDULE
========================================================= */

async function generateSchedule() {

  const button =
    document.getElementById(
      "generateButton"
    );


  const status =
    document.getElementById(
      "status"
    );


  const scheduleContainer =
    document.getElementById(
      "schedule"
    );


  const date =
    document.getElementById(
      "date"
    ).value;


  const availableStart =
    document.getElementById(
      "availableStart"
    ).value;


  const availableEnd =
    document.getElementById(
      "availableEnd"
    ).value;


  const breakMinutes =
    Number(
      document.getElementById(
        "breakMinutes"
      ).value || 0
    );


  if (!date) {

    showStatus(
      "Choose a date first.",
      true
    );

    return;

  }


  if (
    !availableStart ||
    !availableEnd
  ) {

    showStatus(
      "Choose your available study time.",
      true
    );

    return;

  }


  if (
    availableStart >=
    availableEnd
  ) {

    showStatus(
      "Your end time must be later than your start time.",
      true
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Generating...";


  showStatus(
    "Tempo is building your schedule..."
  );


  scheduleContainer.innerHTML = `

    <div class="loading">
      Thinking...
    </div>

  `;


  try {

    /* -----------------------------------------
       GET TASKS
    ----------------------------------------- */

    const taskResult =
      await api(
        "getTasks",
        {
          token: token
        }
      );


    if (!taskResult.success) {

      throw new Error(
        taskResult.error ||
        "Could not load tasks."
      );

    }


    const allTasks =
      taskResult.tasks || [];


    const unfinishedTasks =
      allTasks.filter(
        task =>
          !task.completed
      );


    /* -----------------------------------------
       GET TESTS
    ----------------------------------------- */

    const tests =
      await loadTests();


    /* -----------------------------------------
       SEND TO AI
    ----------------------------------------- */

    const result =
      await api(
        "generateSchedule",
        {

          tasks: {

            date:
              date,

            weekday:
              getWeekday(date),

            availableStart:
              availableStart,

            availableEnd:
              availableEnd,

            breakMinutes:
              breakMinutes,

            tasks:
              unfinishedTasks,

            tests:
              tests

          }

        }
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        "The AI could not generate a schedule."
      );

    }


    const scheduleData =
      result.data;


    const schedule =
      scheduleData.schedule ||
      [];


    displaySchedule(
      schedule
    );


    showStatus(
      "Your schedule is ready."
    );

  }


  catch(error) {

    scheduleContainer.innerHTML = `

      <div class="empty">

        Could not generate the schedule.

      </div>

    `;


    showStatus(
      error.message ||
      "Something went wrong.",
      true
    );

  }


  finally {

    button.disabled =
      false;

    button.textContent =
      "Generate AI Schedule";

  }

}


/* =========================================================
   DISPLAY SCHEDULE
========================================================= */

function displaySchedule(
  schedule
) {

  const container =
    document.getElementById(
      "schedule"
    );


  if (
    !Array.isArray(schedule) ||
    schedule.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        Tempo couldn't find any study sessions
        for this time period.

      </div>

    `;

    return;

  }


  const totalMinutes =
    schedule.reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.minutes || 0
        ),
      0
    );


  container.innerHTML = `

    <div class="summary">

      <div class="summary-item">

        ${schedule.length}
        session${schedule.length === 1 ? "" : "s"}

      </div>

      <div class="summary-item">

        ${totalMinutes}
        minutes of study

      </div>

    </div>


    <div class="schedule">

      ${
        schedule
          .map(item => {

            return `

              <div class="schedule-item">

                <div class="time">

                  ${escapeHTML(
                    item.start || ""
                  )}

                  <br>

                  ${escapeHTML(
                    item.end || ""
                  )}

                </div>


                <div class="schedule-main">

                  <div class="schedule-subject">

                    ${escapeHTML(
                      item.subject || "Study"
                    )}

                  </div>

                  <div class="schedule-task">

                    ${escapeHTML(
                      item.task || "Study"
                    )}

                  </div>

                </div>


                <div class="schedule-minutes">

                  ${Number(
                    item.minutes || 0
                  )} min

                </div>

              </div>

            `;

          })
          .join("")
      }

    </div>

  `;

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  error = false
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status " +
    (
      error
        ? "error"
        : "success"
    );

}


/* =========================================================
   START
========================================================= */

setDefaultDate();

loadTasks();

</script>

</body>
</html>
